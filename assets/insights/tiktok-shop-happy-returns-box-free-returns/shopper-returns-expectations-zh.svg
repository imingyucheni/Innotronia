<svg xmlns="http://www.w3.org/2000/svg" width="640" height="304" viewBox="0 0 640 304" font-family="Inter, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <rect width="640" height="304" rx="22" fill="#0e0e1a"/>
  <rect x="0.5" y="0.5" width="639" height="303" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
  <text x="32" y="58" font-size="28" font-weight="700" fill="#f4f2fb">美国网购消费者对退货的期待</text>
  <text x="214.0" y="112" font-size="18" fill="#d9d6e6" text-anchor="end">免费退货很重要</text>
  <rect x="228.0" y="94" width="259.1" height="24" rx="6" fill="#ff3d8b"/><text x="497.1" y="112" font-size="18" font-weight="600" fill="#f4f2fb">82%</text>
  <text x="214.0" y="164" font-size="18" fill="#d9d6e6" text-anchor="end">更倾向即时退款/换货</text>
  <rect x="228.0" y="146" width="240.2" height="24" rx="6" fill="#ff3d8b"/><text x="478.2" y="164" font-size="18" font-weight="600" fill="#f4f2fb">76%</text>
  <text x="214.0" y="216" font-size="18" fill="#d9d6e6" text-anchor="end">退货体验差就不再回购</text>
  <rect x="228.0" y="198" width="224.4" height="24" rx="6" fill="#ff3d8b"/><text x="462.4" y="216" font-size="18" font-weight="600" fill="#f4f2fb">71%</text>
  <text x="32" y="264" font-size="15" fill="#6f6d85">来源：NRF 与 Happy Returns《2025 零售退货报告》（2025 年 10 月 15 日），调研</text>
  <text x="32" y="284" font-size="15" fill="#6f6d85">2,006 名美国网购消费者。</text>
</svg>
