<svg xmlns="http://www.w3.org/2000/svg" width="640" height="376" viewBox="0 0 640 376" font-family="Inter, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <rect width="640" height="376" rx="22" fill="#0e0e1a"/>
  <rect x="0.5" y="0.5" width="639" height="375" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
  <text x="32" y="58" font-size="28" font-weight="700" fill="#f4f2fb">Announced 2027 parcel rate increases</text>
  <text x="250.0000000000001" y="112" font-size="18" fill="#d9d6e6" text-anchor="end">UPS daily rates (Dec 21)</text>
  <rect x="264.0000000000001" y="94" width="206.5" height="24" rx="6" fill="#ff3d8b"/><text x="480.5" y="112" font-size="18" font-weight="600" fill="#f4f2fb">5.9%</text>
  <text x="250.0000000000001" y="164" font-size="18" fill="#d9d6e6" text-anchor="end">UPS small business rates</text>
  <rect x="264.0000000000001" y="146" width="157.5" height="24" rx="6" fill="#ff3d8b"/><text x="431.5" y="164" font-size="18" font-weight="600" fill="#f4f2fb">4.5%</text>
  <text x="250.0000000000001" y="216" font-size="18" fill="#d9d6e6" text-anchor="end">FedEx list rates (Jan 4)</text>
  <rect x="264.0000000000001" y="198" width="206.5" height="24" rx="6" fill="#ff3d8b"/><text x="480.5" y="216" font-size="18" font-weight="600" fill="#f4f2fb">5.9%</text>
  <text x="250.0000000000001" y="268" font-size="18" fill="#d9d6e6" text-anchor="end">FedEx Ground 1–5 lb</text>
  <rect x="264.0000000000001" y="250" width="227.5" height="24" rx="6" fill="#ff3d8b"/><text x="501.5" y="268" font-size="18" font-weight="600" fill="#f4f2fb">6.5%</text>
  <text x="32" y="316" font-size="15" fill="#6f6d85">Sources: Supply Chain Dive (Oct 26, 2026), citing UPS and FedEx; FedEx Ground</text>
  <text x="32" y="336" font-size="15" fill="#6f6d85">1–5 lb average from Gooding Supply Chain Advisors (Oct 23, 2026), citing</text>
  <text x="32" y="356" font-size="15" fill="#6f6d85">FedEx rate tables.</text>
</svg>
