<svg xmlns="http://www.w3.org/2000/svg" width="640" height="522" viewBox="0 0 640 522" font-family="Inter, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <rect width="640" height="522" rx="22" fill="#0e0e1a"/>
  <rect x="0.5" y="0.5" width="639" height="521" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
  <text x="32" y="58" font-size="28" font-weight="700" fill="#f4f2fb">5 万美元垫资、5,000 美元费用：还款越快，</text>
  <text x="32" y="94" font-size="28" font-weight="700" fill="#f4f2fb">年化成本越高</text>
  <line x1="76" x2="612" y1="412.0" y2="412.0" stroke="#ffffff" stroke-opacity="0.16"/><text x="64" y="417.0" font-size="16" fill="#6f6d85" text-anchor="end">0.0%</text>
  <line x1="76" x2="612" y1="342.0" y2="342.0" stroke="#ffffff" stroke-opacity="0.07"/><text x="64" y="347.0" font-size="16" fill="#6f6d85" text-anchor="end">10.0%</text>
  <line x1="76" x2="612" y1="272.0" y2="272.0" stroke="#ffffff" stroke-opacity="0.07"/><text x="64" y="277.0" font-size="16" fill="#6f6d85" text-anchor="end">20.0%</text>
  <line x1="76" x2="612" y1="202.0" y2="202.0" stroke="#ffffff" stroke-opacity="0.07"/><text x="64" y="207.0" font-size="16" fill="#6f6d85" text-anchor="end">30.0%</text>
  <line x1="76" x2="612" y1="132.0" y2="132.0" stroke="#ffffff" stroke-opacity="0.07"/><text x="64" y="137.0" font-size="16" fill="#6f6d85" text-anchor="end">40.0%</text>
  <rect x="111.0" y="132.0" width="60.0" height="280.0" rx="6" fill="#ff3d8b"/><text x="141.0" y="123.0" font-size="16" font-weight="600" fill="#f4f2fb" text-anchor="middle">40.0%</text>
  <rect x="245.0" y="272.0" width="60.0" height="140.0" rx="6" fill="#ff3d8b"/><text x="275.0" y="263.0" font-size="16" font-weight="600" fill="#f4f2fb" text-anchor="middle">20.0%</text>
  <rect x="379.0" y="318.9" width="60.0" height="93.1" rx="6" fill="#ff3d8b"/><text x="409.0" y="309.9" font-size="16" font-weight="600" fill="#f4f2fb" text-anchor="middle">13.3%</text>
  <rect x="513.0" y="342.0" width="60.0" height="70.0" rx="6" fill="#ff3d8b"/><text x="543.0" y="333.0" font-size="16" font-weight="600" fill="#f4f2fb" text-anchor="middle">10.0%</text>
  <text x="143.0" y="438" font-size="16" fill="#a3a1b8" text-anchor="middle">3 个月还清</text>
  <text x="277.0" y="438" font-size="16" fill="#a3a1b8" text-anchor="middle">6 个月</text>
  <text x="411.0" y="438" font-size="16" fill="#a3a1b8" text-anchor="middle">9 个月</text>
  <text x="545.0" y="438" font-size="16" fill="#a3a1b8" text-anchor="middle">12 个月</text>
  <text x="32" y="482" font-size="15" fill="#6f6d85">计算：系数 1.10（费用 5,000 ÷ 垫资 50,000）× 12 ÷ 还款月数。仅为示例；由于余额</text>
  <text x="32" y="502" font-size="15" fill="#6f6d85">随还款减少，真实 APR 会更高。</text>
</svg>
