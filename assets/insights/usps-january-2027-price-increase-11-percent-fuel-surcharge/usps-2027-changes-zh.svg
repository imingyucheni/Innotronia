  <text x="32" y="58" font-size="28" font-weight="700" fill="#f4f2fb">USPS 2027 年 1 月 17 日起调整幅度（%）</text>
  <text x="245.68000000000006" y="112" font-size="18" fill="#d9d6e6" text-anchor="end">国内基础运价（平均）</text>
