<svg xmlns="http://www.w3.org/2000/svg" width="640" height="336" viewBox="0 0 640 336" font-family="Inter, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <rect width="640" height="336" rx="22" fill="#0e0e1a"/>
  <rect x="0.5" y="0.5" width="639" height="335" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
  <text x="32" y="58" font-size="28" font-weight="700" fill="#f4f2fb">Wayfair 2026 年第三季度同比变化</text>
  <text x="124.0" y="112" font-size="18" fill="#d9d6e6" text-anchor="end">交付订单数</text>
  <rect x="138.0" y="94" width="330.2" height="24" rx="6" fill="#ff3d8b"/><text x="478.2" y="112" font-size="18" font-weight="600" fill="#f4f2fb">12.2%</text>
  <text x="124.0" y="164" font-size="18" fill="#d9d6e6" text-anchor="end">美国净营收</text>
  <rect x="138.0" y="146" width="308.6" height="24" rx="6" fill="#ff3d8b"/><text x="456.6" y="164" font-size="18" font-weight="600" fill="#f4f2fb">11.4%</text>
  <text x="124.0" y="216" font-size="18" fill="#d9d6e6" text-anchor="end">总净营收</text>
  <rect x="138.0" y="198" width="262.5" height="24" rx="6" fill="#ff3d8b"/><text x="410.5" y="216" font-size="18" font-weight="600" fill="#f4f2fb">9.7%</text>
  <text x="124.0" y="268" font-size="18" fill="#d9d6e6" text-anchor="end">活跃客户数</text>
  <rect x="138.0" y="250" width="127.2" height="24" rx="6" fill="#ff3d8b"/><text x="275.2" y="268" font-size="18" font-weight="600" fill="#f4f2fb">4.7%</text>
  <text x="32" y="316" font-size="15" fill="#6f6d85">来源：Wayfair 2026 年第三季度财报（2026 年 11 月 4 日）。</text>
</svg>
