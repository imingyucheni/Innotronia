<svg xmlns="http://www.w3.org/2000/svg" width="640" height="388" viewBox="0 0 640 388" font-family="Inter, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
