  <rect x="272" y="94" width="251.6" height="24" rx="6" fill="#ff3d8b"/><text x="533.6" y="112" font-size="18" font-weight="600" fill="#f4f2fb">74.0%</text>
  <text x="258" y="164" font-size="18" fill="#d9d6e6" text-anchor="end">Merchant solutions revenue</text>
  <rect x="272" y="146" width="119.0" height="24" rx="6" fill="#ff3d8b"/><text x="401.0" y="164" font-size="18" font-weight="600" fill="#f4f2fb">35.0%</text>
  <text x="258" y="216" font-size="18" fill="#d9d6e6" text-anchor="end">International GMV</text>
  <rect x="272" y="198" width="108.8" height="24" rx="6" fill="#ff3d8b"/><text x="390.8" y="216" font-size="18" font-weight="600" fill="#f4f2fb">32.0%</text>
  <text x="258" y="268" font-size="18" fill="#d9d6e6" text-anchor="end">Offline (POS) GMV</text>
  <rect x="272" y="250" width="102.0" height="24" rx="6" fill="#ff3d8b"/><text x="384.0" y="268" font-size="18" font-weight="600" fill="#f4f2fb">30.0%</text>
