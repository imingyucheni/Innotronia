<svg xmlns="http://www.w3.org/2000/svg" width="640" height="356" viewBox="0 0 640 356" font-family="Inter, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <rect width="640" height="356" rx="22" fill="#0e0e1a"/>
  <rect x="0.5" y="0.5" width="639" height="355" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
  <text x="32" y="58" font-size="28" font-weight="700" fill="#f4f2fb">Holiday 2026 growth forecasts vs 2025</text>
  <text x="198.16000000000008" y="112" font-size="18" fill="#d9d6e6" text-anchor="end">NRF: total retail</text>
  <rect x="212.16000000000008" y="94" width="116.1" height="24" rx="6" fill="#ff3d8b"/><text x="338.3" y="112" font-size="18" font-weight="600" fill="#f4f2fb">4.2%</text>
  <text x="198.16000000000008" y="164" font-size="18" fill="#d9d6e6" text-anchor="end">Adobe: US online</text>
  <rect x="212.16000000000008" y="146" width="185.3" height="24" rx="6" fill="#ff3d8b"/><text x="407.4" y="164" font-size="18" font-weight="600" fill="#f4f2fb">6.7%</text>
  <text x="198.16000000000008" y="216" font-size="18" fill="#d9d6e6" text-anchor="end">Bain: nonstore</text>
  <rect x="212.16000000000008" y="198" width="248.9" height="24" rx="6" fill="#ff3d8b"/><text x="471.0" y="216" font-size="18" font-weight="600" fill="#f4f2fb">9.0%</text>
  <text x="198.16000000000008" y="268" font-size="18" fill="#d9d6e6" text-anchor="end">Mastercard: online</text>
  <rect x="212.16000000000008" y="250" width="304.2" height="24" rx="6" fill="#ff3d8b"/><text x="526.3" y="268" font-size="18" font-weight="600" fill="#f4f2fb">11.0%</text>
  <text x="32" y="316" font-size="15" fill="#6f6d85">Sources: NRF (Oct 15, 2026); Bain, Mastercard and Adobe forecasts as</text>
  <text x="32" y="336" font-size="15" fill="#6f6d85">reported by WWD (Oct 15, 2026). Scopes and periods differ.</text>
