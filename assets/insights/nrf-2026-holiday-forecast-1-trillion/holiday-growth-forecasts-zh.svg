  <text x="32" y="316" font-size="15" fill="#6f6d85">来源：NRF（2026 年 10 月 15 日）；贝恩、万事达和 Adobe 预测据 WWD 报道（2026</text>
  <text x="32" y="336" font-size="15" fill="#6f6d85">年 10 月 15 日）。各机构口径和时间段不同。</text>
