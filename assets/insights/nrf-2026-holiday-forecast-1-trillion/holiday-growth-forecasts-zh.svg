  <text x="178.0" y="164" font-size="18" fill="#d9d6e6" text-anchor="end">Adobe：美国线上</text>
  <rect x="192.0" y="146" width="196.5" height="24" rx="6" fill="#ff3d8b"/><text x="398.5" y="164" font-size="18" font-weight="600" fill="#f4f2fb">6.7%</text>
