  <text x="258" y="408" font-size="18" fill="#d9d6e6" text-anchor="end">Plastic tableware &amp; beads</text>
  <rect x="272" y="390" width="32.6" height="24" rx="6" fill="#ff3d8b"/><text x="314.6" y="408" font-size="18" font-weight="600" fill="#f4f2fb">3</text>
