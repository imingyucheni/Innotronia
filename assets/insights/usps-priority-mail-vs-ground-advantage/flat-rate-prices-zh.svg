  <text x="142.0" y="239" font-size="18" fill="#d9d6e6" text-anchor="end">小号统一价箱</text>
  <rect x="156.0" y="206" width="142.1" height="24" rx="6" fill="#ff3d8b"/><text x="308.1" y="224" font-size="18" font-weight="600" fill="#f4f2fb">$14.65</text>
  <rect x="156.0" y="236" width="125.6" height="24" rx="6" fill="#8b6cff"/><text x="291.6" y="254" font-size="18" font-weight="600" fill="#f4f2fb">$12.95</text>
