<svg xmlns="http://www.w3.org/2000/svg" width="640" height="424" viewBox="0 0 640 424" font-family="Inter, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <rect width="640" height="424" rx="22" fill="#0e0e1a"/>
