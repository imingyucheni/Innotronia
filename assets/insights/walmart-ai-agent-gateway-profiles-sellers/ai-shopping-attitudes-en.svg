<svg xmlns="http://www.w3.org/2000/svg" width="640" height="304" viewBox="0 0 640 304" font-family="Inter, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <rect width="640" height="304" rx="22" fill="#0e0e1a"/>
  <rect x="0.5" y="0.5" width="639" height="303" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
  <text x="32" y="58" font-size="28" font-weight="700" fill="#f4f2fb">US adults on AI shopping agents</text>
  <text x="258" y="112" font-size="18" fill="#d9d6e6" text-anchor="end">Want final say at checkout</text>
  <rect x="272" y="94" width="238.0" height="24" rx="6" fill="#ff3d8b"/><text x="520.0" y="112" font-size="18" font-weight="600" fill="#f4f2fb">70%</text>
  <text x="258" y="164" font-size="18" fill="#d9d6e6" text-anchor="end">Have used AI to buy</text>
  <rect x="272" y="146" width="37.4" height="24" rx="6" fill="#ff3d8b"/><text x="319.4" y="164" font-size="18" font-weight="600" fill="#f4f2fb">11%</text>
  <text x="258" y="216" font-size="18" fill="#d9d6e6" text-anchor="end">Would give AI full control</text>
  <rect x="272" y="198" width="34.0" height="24" rx="6" fill="#ff3d8b"/><text x="316.0" y="216" font-size="18" font-weight="600" fill="#f4f2fb">10%</text>
  <text x="32" y="264" font-size="15" fill="#6f6d85">Source: NMI survey of 1,000 US adults (Aug 2026), as reported by Digital</text>
  <text x="32" y="284" font-size="15" fill="#6f6d85">Commerce 360 (Oct 23, 2026).</text>
</svg>
