<svg xmlns="http://www.w3.org/2000/svg" width="640" height="512" viewBox="0 0 640 512" font-family="Inter, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <rect width="640" height="512" rx="22" fill="#0e0e1a"/>
  <rect x="0.5" y="0.5" width="639" height="511" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
  <text x="32" y="58" font-size="28" font-weight="700" fill="#f4f2fb">September 2026 sales vs September 2025</text>
  <text x="239.92000000000013" y="112" font-size="18" fill="#d9d6e6" text-anchor="end">Sporting goods &amp; hobby</text>
  <rect x="253.92000000000013" y="94" width="278.5" height="24" rx="6" fill="#ff3d8b"/><text x="542.4" y="112" font-size="18" font-weight="600" fill="#f4f2fb">9.6%</text>
  <text x="239.92000000000013" y="164" font-size="18" fill="#d9d6e6" text-anchor="end">Electronics &amp; appliance</text>
  <rect x="253.92000000000013" y="146" width="272.7" height="24" rx="6" fill="#ff3d8b"/><text x="536.6" y="164" font-size="18" font-weight="600" fill="#f4f2fb">9.4%</text>
  <text x="239.92000000000013" y="216" font-size="18" fill="#d9d6e6" text-anchor="end">Nonstore (incl. online)</text>
  <rect x="253.92000000000013" y="198" width="237.9" height="24" rx="6" fill="#ff3d8b"/><text x="501.8" y="216" font-size="18" font-weight="600" fill="#f4f2fb">8.2%</text>
  <text x="239.92000000000013" y="268" font-size="18" fill="#d9d6e6" text-anchor="end">Total retail &amp; food</text>
  <rect x="253.92000000000013" y="250" width="182.8" height="24" rx="6" fill="#ff3d8b"/><text x="446.7" y="268" font-size="18" font-weight="600" fill="#f4f2fb">6.3%</text>
  <text x="239.92000000000013" y="320" font-size="18" fill="#d9d6e6" text-anchor="end">Clothing &amp; accessories</text>
  <rect x="253.92000000000013" y="302" width="145.0" height="24" rx="6" fill="#ff3d8b"/><text x="409.0" y="320" font-size="18" font-weight="600" fill="#f4f2fb">5.0%</text>
  <text x="239.92000000000013" y="372" font-size="18" fill="#d9d6e6" text-anchor="end">Furniture &amp; home</text>
  <rect x="253.92000000000013" y="354" width="142.1" height="24" rx="6" fill="#ff3d8b"/><text x="406.1" y="372" font-size="18" font-weight="600" fill="#f4f2fb">4.9%</text>
  <text x="239.92000000000013" y="424" font-size="18" fill="#d9d6e6" text-anchor="end">General merchandise</text>
  <rect x="253.92000000000013" y="406" width="121.8" height="24" rx="6" fill="#ff3d8b"/><text x="385.8" y="424" font-size="18" font-weight="600" fill="#f4f2fb">4.2%</text>
  <text x="32" y="472" font-size="15" fill="#6f6d85">Source: US Census Bureau, Advance Monthly Retail Trade Survey (Oct 15,</text>
  <text x="32" y="492" font-size="15" fill="#6f6d85">2026). Seasonally adjusted, not adjusted for prices.</text>
